# Render blueprint for the free-tier demo deployment.
#
# Architecture:
#   Cloudflare Pages (React/Vite)  ->  Render web service (Django + Gunicorn)  ->  Neon Postgres
#
# Celery runs in eager mode on Render because free web services cannot attach a
# free background worker. Analyses still complete, inside the HTTP request.
#
# Deploy: Render Dashboard -> New -> Blueprint -> select this repository.
# Set DATABASE_URL to the Neon pooled connection string when prompted.
#
# Full walkthrough: docs/DEPLOY_RENDER.md

services:
  - type: web
    name: route-safety-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "1"
      # Neon pooled connection string, e.g.
      # postgresql://user:pass@ep-xxx-pooler.us-west-2.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Free plan has 512 MB RAM; one Gunicorn worker leaves headroom for
      # timezonefinder/numpy imports.
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      # No free Celery worker on Render, so run tasks inline.
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "1"
      # Replace route-safety with the actual Cloudflare Pages project name.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://route-safety.pages.dev"
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: "^https://([a-z0-9-]+\\.)?route-safety\\.pages\\.dev$"
      - key: LOG_LEVEL
        value: "INFO"
